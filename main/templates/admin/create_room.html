{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <h1 class="mb-4 fw-bold">
                        Create Room
                    </h1>

                    <form method="POST"
                          enctype="multipart/form-data">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Title
                            </label>

                            {{ form.title }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            {{ form.description }}

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Price
                                </label>

                                {{ form.price }}

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Capacity
                                </label>

                                {{ form.capacity }}

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Room Type
                            </label>

                            {{ form.room_type }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Available
                            </label>

                            {{ form.is_available }}

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Room Image
                            </label>

                            <input type="file"
                                   name="image"
                                   class="form-control">

                        </div>

                        <button class="btn btn-success px-4">
                            Save Room
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
