{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <h1 class="mb-4 fw-bold">
                        Edit Room
                    </h1>

                    <form method="POST"
                          enctype="multipart/form-data">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Title
                            </label>

                            {{ form.title }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            {{ form.description }}

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Price
                                </label>

                                {{ form.price }}

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Capacity
                                </label>

                                {{ form.capacity }}

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Room Type
                            </label>

                            {{ form.room_type }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Available
                            </label>

                            {{ form.is_available }}

                        </div>

                        {% if room.images.first %}

                            <div class="mb-3">

                                <label class="form-label">
                                    Current Image
                                </label>

                                <br>

                                <img src="{{ room.images.first.image.url }}"
                                     width="250"
                                     class="rounded shadow-sm">

                            </div>

                        {% endif %}

                        <div class="mb-4">

                            <label class="form-label">
                                Change Image
                            </label>

                            <input type="file"
                                   name="image"
                                   class="form-control">

                        </div>

                        <div class="d-flex gap-2">

                            <button class="btn btn-primary px-4">
                                Update Room
                            </button>

                            <a href="{% url 'admin_rooms' %}"
                               class="btn btn-secondary">
                                Back
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
