{% extends 'base.html' %}

{% block content %}

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card shadow p-4">

                <h2 class="text-center mb-3">Register</h2>

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label>Username</label>
                        {{ form.username }}
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        {{ form.email }}
                    </div>

                    <div class="mb-3">
                        <label>Password</label>
                        {{ form.password1 }}
                    </div>

                    <div class="mb-3">
                        <label>Confirm password</label>
                        {{ form.password2 }}
                    </div>

                    <button class="btn btn-success w-100">
                        Register
                    </button>
                </form>

                <hr>

                <p class="text-center">
                    Already have account?
                    <a href="{% url 'login' %}">Login</a>
                </p>

            </div>

        </div>
    </div>
</div>

{% endblock %}
